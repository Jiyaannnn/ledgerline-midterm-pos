services:
  - type: web
    name: ledgerline-midterm-pos
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_TLS
        value: "true"
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
